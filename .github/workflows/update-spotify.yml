# Refreshes public/spotify.json with the last track played on Spotify and
# redeploys the site when it changes.
name: Update recently played

on:
  # GitHub delays or drops scheduled runs under load, worst at :00 and :30,
  # so this runs off those minutes.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write # push the updated spotify.json
  actions: write # start the Pages deploy

concurrency:
  group: update-spotify
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Fetch recently played track
        run: node scripts/fetch-spotify.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

      - name: Commit if the track changed
        id: commit
        run: |
          if git diff --quiet -- public/spotify.json; then
            echo "Track unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/spotify.json
          git commit -m "Update recently played track"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so the
      # Pages deploy is started explicitly.
      - name: Deploy site
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run astro.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
